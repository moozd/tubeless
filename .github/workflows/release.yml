name: release

# Builds and packages tubeless for every supported platform on a version
# tag push, then attaches every package to a GitHub Release. GLFW's cgo
# dependency (Cocoa on macOS, X11/Wayland on Linux) can't cross-compile
# reliably, so each arch/OS combination builds on its own native runner
# instead of cross-compiling from one (see Makefile's package-linux and
# package-darwin comments).
on:
  push:
    tags:
      - "v*"
  # A manual fallback: re-pushing a deleted-and-recreated tag doesn't
  # reliably redeliver a push event (observed — GitHub sometimes just
  # doesn't fire one), so this lets a rebuild be forced against an
  # existing tag on demand: `gh workflow run release.yml -f tag=v0.1.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

jobs:
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GLFW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Build and package
        run: make package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          # Only the actual packages — dist/ also holds the intermediate
          # linux-<arch>/ build tree and template files (.desktop, nfpm's
          # generated yaml), which gh release create can't upload as
          # assets (it errors on a directory).
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zst

  macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        run: make package-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a manual re-run (see workflow_dispatch above)
          # targets a tag that may already have a release from an earlier
          # attempt — replace it rather than failing outright.
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
